name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: npm run doctor -- --host-version 0.2.1-rc.2
      - run: npm pack --dry-run
      - run: node --check preset-bundle/index.js && cd preset-bundle && npm pack --dry-run
